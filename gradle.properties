# ============================================================================
# Speaker API — 集中版本面板（四个子项目共用）
# ============================================================================
mod_version=1.0.0

# --- 通用 ---
# 沙箱/部分网络环境对 maven.neoforged.net 的 TLS1.3 握手会被重置，强制 TLSv1.2。
org.gradle.jvmargs=-Xmx4G -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.caching=true

# --- ForgeGradle（1.19.2 / 1.20.1 共用同一版 FG6）---
# 不可用 FG5：FG5 拒绝 Gradle 8，而同一构建必须与 ModDevGradle 共用 Gradle 8。
forgegradle_version=6.0.54

# --- v1912-forge ---
v1912_minecraft_version=1.19.2
v1912_forge_version=1.19.2-43.3.9
v1912_java_toolchain=17

# --- v1201-forge ---
v1201_minecraft_version=1.20.1
v1201_forge_version=1.20.1-47.2.30
v1201_java_toolchain=17

# --- v2111-neoforge ---
v2111_minecraft_version=1.21.1
# 真实发布号，已在本地构建/运行链路验证过（勿用臆测号 21.1.0 / 21.1.104）。
v2111_neoforge_version=21.1.251
v2111_java_toolchain=21
